services:
  backend-api:
    image: iamnikhilh/backend-api:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_API_PORT:-4000}
      JWT_ACCESS_EXPIRES_IN: ${BACKEND_JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${BACKEND_JWT_REFRESH_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${BACKEND_API_PORT:-4000}:4000"
    restart: unless-stopped

  frontend-portal:
    image: iamnikhilh/frontend-portal:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${FRONTEND_PORT:-5173}
      BACKEND_URL: ${BACKEND_URL:-http://backend-api:4000}
    depends_on:
      - backend-api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    restart: unless-stopped

volumes:
  app-data:
